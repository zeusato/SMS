<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#0A2762"/></marker></defs><rect width="1400" height="590" fill="white"/><g font-family="Arial, Segoe UI, sans-serif"><rect x="15" y="30" width="365" height="330" rx="12" fill="#F3F6FA" stroke="#BBC9DA" stroke-width="2"/><text x="197.5" y="73" font-size="32" fill="#0A2762" font-weight="700" text-anchor="middle"><tspan x="197.5" dy="0">Nguồn thông tin</tspan></text><text x="197.5" y="113" font-size="29" fill="#142538" font-weight="400" text-anchor="middle"><tspan x="197.5" dy="0">Khách hàng và tài khoản</tspan><tspan x="197.5" dy="37">Tài sản và giao dịch</tspan><tspan x="197.5" dy="37">Sản phẩm và thị trường</tspan><tspan x="197.5" dy="37">Nhu cầu và tương tác</tspan></text><rect x="450" y="30" width="500" height="330" rx="12" fill="#0A2762" stroke="#0A2762" stroke-width="2"/><text x="700.0" y="73" font-size="32" fill="white" font-weight="700" text-anchor="middle"><tspan x="700.0" dy="0">Hệ thống quản lý kịch bản</tspan></text><text x="700.0" y="113" font-size="29" fill="white" font-weight="400" text-anchor="middle"><tspan x="700.0" dy="0">Thiết lập và quản lý phiên bản</tspan><tspan x="700.0" dy="37">Đánh giá điều kiện</tspan><tspan x="700.0" dy="37">Áp dụng chính sách</tspan><tspan x="700.0" dy="37">Điều phối và theo dõi</tspan></text><rect x="1020" y="30" width="365" height="330" rx="12" fill="#F3F6FA" stroke="#BBC9DA" stroke-width="2"/><text x="1202.5" y="73" font-size="32" fill="#0A2762" font-weight="700" text-anchor="middle"><tspan x="1202.5" dy="0">Kênh thực hiện</tspan></text><text x="1202.5" y="113" font-size="29" fill="#142538" font-weight="400" text-anchor="middle"><tspan x="1202.5" dy="0">Thông báo đa kênh</tspan><tspan x="1202.5" dy="37">Offer và giao việc</tspan><tspan x="1202.5" dy="37">Tác nghiệp nghiệp vụ</tspan><tspan x="1202.5" dy="37">Ti