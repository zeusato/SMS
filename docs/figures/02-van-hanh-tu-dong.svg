<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0A2762"/></marker></defs>
<rect width="1200" height="1110" fill="white"/>
<g font-family="Arial, Segoe UI, sans-serif"><rect x="70" y="20" width="500" height="85" rx="12" fill="#FFF3E3" stroke="#FE8700" stroke-width="2"/><text x="320" y="57" fill="#0A2762" font-size="30" font-weight="bold" text-anchor="middle"><tspan x="320" dy="0">Sự kiện phù hợp</tspan></text><text x="320" y="90" fill="#142538" font-size="23" font-weight="normal" text-anchor="middle"><tspan x="320" dy="0">Một trong các sự kiện đã đăng ký</tspan></text><rect x="630" y="20" width="500" height="85" rx="12" fill="#FFF3E3" stroke="#FE8700" stroke-width="2"/><text x="880" y="57" fill="#0A2762" font-size="30" font-weight="bold" text-anchor="middle"><tspan x="880" dy="0">Đến mốc lịch</tspan></text><text x="880" y="90" fill="#142538" font-size="23" font-weight="normal" text-anchor="middle"><tspan x="880" dy="0">Theo chu kỳ và lịch đã thiết lập</tspan></text><path d="M320 106 V139 H600 V169" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><path d="M880 106 V139 H600 V169" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><rect x="160" y="173" width="880" height="83" rx="12" fill="#F6F8FC" stroke="#B8C6D8" stroke-width="2"/><text x="600" y="209" fill="#0A2762" font-size="30" font-weight="bold" text-anchor="middle"><tspan x="600" dy="0">Tiến trình đang có hiệu lực</tspan></text><text x="600" y="243" fill="#142538" font-size="24" font-weight="normal" text-anchor="middle"><tspan x="600" dy="0">Kiểm tra trạng thái và nguồn kích hoạt</tspan></text><path d="M600 258 V292" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><rect x="160" y="296" width="880" height="78" rx="12" fill="#F6F8FC" stroke="#B8C6D8" stroke-width="2"/><text x="600" y="330" fill="#0A2762" font-size="29" font-weight="bold" text-anchor="middle"><tspan x="600" dy="0">Xác định đối tượng và lấy dữ liệu</tspan></text><text x="600" y="361" fill="#142538" font-size="24" font-weight="normal" text-anchor="middle"><tspan x="600" dy="0">Dùng cấu hình và phiên bản đã công bố</tspan></text><path d="M600 376 V407" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 409 L852 480 L600 551 L348 480 Z" fill="#EDF2FA" stroke="#0A2762" stroke-width="2"/><text x="600" y="472" fill="#0A2762" font-size="26" font-weight="bold" text-anchor="middle"><tspan x="600" dy="0">Đủ điều kiện</tspan><tspan x="600" dy="32">và qua chính sách</tspan></text><path d="M856 480 H916" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><rect x="920" y="425" width="250" height="110" rx="12" fill="#F6F8FC" stroke="#B8C6D8" stroke-width="2"/><text x="1045" y="455" fill="#142538" font-size="23" font-weight="normal" text-anchor="middle"><tspan x="1045" dy="0">Không hoặc thiếu</tspan><tspan x="1045" dy="30">dữ liệu: ghi nhận</tspan><tspan x="1045" dy="30">lý do không chạy</tspan></text><path d="M600 554 V588" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><text x="638" y="576" fill="#526579" font-size="23" font-weight="normal" text-anchor="start"><tspan x="638" dy="0">Có</tspan></text><rect x="160" y="592" width="880" height="83" rx="12" fill="#0A2762" stroke="#0A2762" stroke-width="2"/><text x="600" y="627" fill="white" font-size="29" font-weight="bold" text-anchor="middle"><tspan x="600" dy="0">Thực hiện các hành động đã cấu hình</tspan></text><text x="600" y="659" fill="white" font-size="24" font-weight="normal" text-anchor="middle"><tspan x="600" dy="0">Thông báo, offer, giao việc hoặc thao tác nghiệp vụ</tspan></text><path d="M600 678 V711" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><rect x="160" y="715" width="880" height="70" rx="12" fill="#F6F8FC" stroke="#B8C6D8" stroke-width="2"/><text x="600" y="758" fill="#0A2762" font-size="28" font-weight="bold" text-anchor="middle"><tspan x="600" dy="0">Lưu kết quả hành động và lịch sử</tspan></text><path d="M600 787 V810 H320 V840" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 787 V810 H880 V840" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="844" width="500" height="92" rx="12" fill="#FFF3E3" stroke="#FE8700" stroke-width="2"/><text x="320" y="881" fill="#0A2762" font-size="28" font-weight="bold" text-anchor="middle"><tspan x="320" dy="0">Hậu xử lý từng lần</tspan></text><text x="320" y="919" fill="#142538" font-size="23" font-weight="normal" text-anchor="middle"><tspan x="320" dy="0">Tạo và theo dõi phần việc nếu bật</tspan></text><rect x="630" y="844" width="500" height="92" rx="12" fill="#FFF3E3" stroke="#FE8700" stroke-width="2"/><text x="880" y="881" fill="#0A2762" font-size="28" font-weight="bold" text-anchor="middle"><tspan x="880" dy="0">Hậu xử lý theo kỳ</tspan></text><text x="880" y="919" fill="#142538" font-size="23" font-weight="normal" text-anchor="middle"><tspan x="880" dy="0">Tổng hợp khi đến lịch riêng nếu bật</tspan></text><path d="M320 938 V970 H600 V1001" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><path d="M880 938 V970 H600 V1001" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><rect x="160" y="1005" width="880" height="72" rx="12" fill="#EDF2FA" stroke="#0A2762" stroke-width="2"/><text x="600" y="1049" fill="#0A2762" font-size="29" font-weight="bold" text-anchor="middle"><tspan x="600" dy="0">Theo dõi kết quả, thống kê và truy vết</tspan></text><path d="M1171 480 H1188 V1041 H1045" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/></g></svg>