<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0A2762"/></marker></defs>
<rect width="1200" height="1110" fill="white"/>
<g font-family="Arial, Segoe UI, sans-serif"><rect x="70" y="20" width="1060" height="104" rx="12" fill="#F6F8FC" stroke="#B8C6D8" stroke-width="2"/><circle cx="119" cy="72" r="28" fill="#FE8700"/><text x="119" y="82" fill="#0A2762" font-size="29" font-weight="bold" text-anchor="middle"><tspan x="119" dy="0">1</tspan></text><text x="168" y="60" fill="#0A2762" font-size="31" font-weight="bold" text-anchor="start"><tspan x="168" dy="0">Thông tin chung</tspan></text><text x="168" y="98" fill="#142538" font-size="25" font-weight="normal" text-anchor="start"><tspan x="168" dy="0">Tên, danh mục, mục đích và người phụ trách</tspan></text><path d="M600 124 V153" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="153" width="1060" height="104" rx="12" fill="#F6F8FC" stroke="#B8C6D8" stroke-width="2"/><circle cx="119" cy="205" r="28" fill="#FE8700"/><text x="119" y="215" fill="#0A2762" font-size="29" font-weight="bold" text-anchor="middle"><tspan x="119" dy="0">2</tspan></text><text x="168" y="193" fill="#0A2762" font-size="31" font-weight="bold" text-anchor="start"><tspan x="168" dy="0">Điều kiện thỏa mãn</tspan></text><text x="168" y="231" fill="#142538" font-size="25" font-weight="normal" text-anchor="start"><tspan x="168" dy="0">Chọn đại lượng, tạo công thức, kết hợp tất cả hoặc ít nhất một</tspan></text><path d="M600 257 V286" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="286" width="1060" height="104" rx="12" fill="#F6F8FC" stroke="#B8C6D8" stroke-width="2"/><circle cx="119" cy="338" r="28" fill="#FE8700"/><text x="119" y="348" fill="#0A2762" font-size="29" font-weight="bold" text-anchor="middle"><tspan x="119" dy="0">3</tspan></text><text x="168" y="326" fill="#0A2762" font-size="31" font-weight="bold" text-anchor="start"><tspan x="168" dy="0">Cơ chế kích hoạt</tspan></text><text x="168" y="364" fill="#142538" font-size="25" font-weight="normal" text-anchor="start"><tspan x="168" dy="0">Chọn sự kiện HOẶC lịch thời gian; quy tắc tái kích hoạt</tspan></text><path d="M600 390 V419" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="419" width="1060" height="104" rx="12" fill="#F6F8FC" stroke="#B8C6D8" stroke-width="2"/><circle cx="119" cy="471" r="28" fill="#FE8700"/><text x="119" y="481" fill="#0A2762" font-size="29" font-weight="bold" text-anchor="middle"><tspan x="119" dy="0">4</tspan></text><text x="168" y="459" fill="#0A2762" font-size="31" font-weight="bold" text-anchor="start"><tspan x="168" dy="0">Hành động thực hiện</tspan></text><text x="168" y="497" fill="#142538" font-size="25" font-weight="normal" text-anchor="start"><tspan x="168" dy="0">Thông báo và nội dung, giao việc, offer, kiểm soát nghiệp vụ</tspan></text><path d="M600 523 V552" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="552" width="1060" height="104" rx="12" fill="#F6F8FC" stroke="#B8C6D8" stroke-width="2"/><circle cx="119" cy="604" r="28" fill="#FE8700"/><text x="119" y="614" fill="#0A2762" font-size="29" font-weight="bold" text-anchor="middle"><tspan x="119" dy="0">5</tspan></text><text x="168" y="592" fill="#0A2762" font-size="31" font-weight="bold" text-anchor="start"><tspan x="168" dy="0">Hiệu lực và hậu xử lý</tspan></text><text x="168" y="630" fill="#142538" font-size="25" font-weight="normal" text-anchor="start"><tspan x="168" dy="0">Bắt đầu, kết thúc; hậu xử lý từng lần và theo kỳ</tspan></text><path d="M600 656 V684 H380 V706" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="708" width="620" height="80" rx="12" fill="#0A2762" stroke="#0A2762" stroke-width="2"/><text x="380" y="757" fill="white" font-size="31" font-weight="bold" text-anchor="middle"><tspan x="380" dy="0">Kiểm tra và công bố</tspan></text><path d="M692 748 H756" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><text x="722" y="696" fill="#526579" font-size="23" font-weight="normal" text-anchor="middle"><tspan x="722" dy="0">Còn lỗi</tspan></text><rect x="760" y="708" width="370" height="80" rx="12" fill="#FFF3E3" stroke="#FE8700" stroke-width="2"/><text x="945" y="740" fill="#0A2762" font-size="24" font-weight="normal" text-anchor="middle"><tspan x="945" dy="0">Quay về đúng bước</tspan><tspan x="945" dy="30">để chỉnh sửa</tspan></text><path d="M1130 748 H1170 V604 H1134" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M380 790 V816 H600 V850" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="809" fill="#526579" font-size="23" font-weight="normal" text-anchor="start"><tspan x="480" dy="0">Hợp lệ</tspan></text><rect x="70" y="854" width="1060" height="86" rx="12" fill="#EDF2FA" stroke="#0A2762" stroke-width="2"/><text x="600" y="890" fill="#0A2762" font-size="31" font-weight="bold" text-anchor="middle"><tspan x="600" dy="0">Hệ thống tự sinh tiến trình</tspan></text><text x="600" y="924" fill="#142538" font-size="25" font-weight="normal" text-anchor="middle"><tspan x="600" dy="0">Gắn phiên bản, đăng ký sự kiện hoặc lịch và quy tắc hậu xử lý</tspan></text><path d="M600 942 V979" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="983" width="1060" height="96" rx="12" fill="#FFF3E3" stroke="#FE8700" stroke-width="2"/><text x="600" y="1022" fill="#0A2762" font-size="29" font-weight="bold" text-anchor="middle"><tspan x="600" dy="0">Tiến trình sẵn sàng vận hành theo hiệu lực</tspan></text><text x="600" y="1057" fill="#142538" font-size="25" font-weight="normal" text-anchor="middle"><tspan x="600" dy="0">Không cần CNTT lập trình job riêng cho kịch bản</tspan></text></g></svg>