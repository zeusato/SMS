<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#0A2762"/></marker></defs><rect width="1400" height="1100" fill="white"/><g font-family="Arial, Segoe UI, sans-serif"><rect x="35" y="15" width="1330" height="105" rx="12" fill="#F3F6FA" stroke="#BBC9DA" stroke-width="2"/><circle cx="88" cy="68" r="28" fill="#FE8700"/><text x="88" y="79" font-size="31" fill="#0A2762" font-weight="700" text-anchor="middle"><tspan x="88" dy="0">1</tspan></text><text x="140" y="55" font-size="33" fill="#0A2762" font-weight="700" text-anchor="start"><tspan x="140" dy="0">Thông tin chung</tspan></text><text x="140" y="96" font-size="29" fill="#142538" font-weight="400" text-anchor="start"><tspan x="140" dy="0">Mục tiêu, danh mục, phạm vi, đơn vị và người phụ trách</tspan></text><path d="M700 123 V145" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arr)"/><rect x="35" y="147" width="1330" height="105" rx="12" fill="#F3F6FA" stroke="#BBC9DA" stroke-width="2"/><circle cx="88" cy="200" r="28" fill="#FE8700"/><text x="88" y="211" font-size="31" fill="#0A2762" font-weight="700" text-anchor="middle"><tspan x="88" dy="0">2</tspan></text><text x="140" y="187" font-size="33" fill="#0A2762" font-weight="700" text-anchor="start"><tspan x="140" dy="0">Điều kiện thỏa mãn</tspan></text><text x="140" y="228" font-size="29" fill="#142538" font-weight="400" text-anchor="start"><tspan x="140" dy="0">Đại lượng, công thức, nhóm VÀ hoặc HOẶC và xem thử đối tượng</tspan></text><path d="M700 255 V277" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arr)"/><rect x="35" y="279" width="1330" height="105" rx="12" fill="#F3F6FA" stroke="#BBC9DA" stroke-width="2"/><circle cx="88" cy="332" r="28" fill="#FE8700"/><text x="88" y="343" font-size="31" fill="#0A2762" font-weight="700" text-anchor="middle"><tspan x="88" dy="0">3</tspan></text><text x="140" y="319" font-size="33" fill="#0A2762" font-weight="700" text-anchor="start"><tspan x="140" dy="0">Cơ chế kích hoạt</tspan></text><text x="140" y="360" font-size="29" fill="#142538" font-weight="400" text-anchor="start"><tspan x="140" dy="0">Sự kiện HOẶC lịch thời gian, ngoại lệ và quy tắc tái kích hoạt</tspan></text><path d="M700 387 V409" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arr)"/><rect x="35" y="411" width="1330" height="105" rx="12" fill="#F3F6FA" stroke="#BBC9DA" stroke-width="2"/><circle cx="88" cy="464" r="28" fill="#FE8700"/><text x="88" y="475" font-size="31" fill="#0A2762" font-weight="700" text-anchor="middle"><tspan x="88" dy="0">4</tspan></text><text x="140" y="451" font-size="33" fill="#0A2762" font-weight="700" text-anchor="start"><tspan x="140" dy="0">Hành động thực hiện</tspan></text><text x="140" y="492" font-size="29" fill="#142538" font-weight="400" text-anchor="start"><tspan x="140" dy="0">Người nhận, kênh, nội dung, sản phẩm, tham số và thứ tự</tspan></text><path d="M700 519 V541" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arr)"/><rect x="35" y="543" width="1330" height="105" rx="12" fill="#F3F6FA" stroke="#BBC9DA" stroke-width="2"/><circle cx="88" cy="596" r="28" fill="#FE8700"/><text x="88" y="607" font-size="31" fill="#0A2762" font-weight="700" text-anchor="middle"><tspan x="88" dy="0">5</tspan></text><text x="140" y="583" font-size="33" fill="#0A2762" font-weight="700" text-anchor="start"><tspan x="140" dy="0">Hiệu lực và hậu xử lý</tspan></text><text x="140" y="624" font-size="29" fill="#142538" font-weight="400" text-anchor="start"><tspan x="140" dy="0">Bắt đầu, kết thúc, công việc từng lần và tổng hợp theo kỳ</tspan></text><path d="M700 650 V687" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arr)"/><rect x="35" y="690" width="860" height="103" rx="12" fill="#0A2762" stroke="#0A2762" stroke-width="2"/><text x="465.0" y="733" font-size="32" fill="white" font-weight="700" text-anchor="middle"><tspan x="465.0" dy="0">Kiểm tra và phê duyệt theo thẩm quyền</tspan></text><text x="465.0" y="773" font-size="29" fill="white" font-weight="400" text-anchor="middle"><tspan x="465.0" dy="0">Đối chiếu dữ liệu, lịch, hành động, quyền và xung đột</tspan></text><path d="M898 743 H975" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arr)"/><rect x="980" y="690" width="385" height="103" rx="12" fill="#FFF4E6" stroke="#FE8700" stroke-width="2"/><text x="1172.5" y="733" font-size="32" fill="#0A2762" font-weight="700" text-anchor="middle"><tspan x="1172.5" dy="0">Cần bổ sung</tspan></text><text x="1172.5" y="773" font-size="29" fill="#142538" font-weight="400" text-anchor="middle"><tspan x="1172.5" dy="0">Trở về bước liên quan</tspan></text><path d="M1170 687 V669 H1378 V70 H1369" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="9 7"/><path d="M465 796 V846 H700 V875" fill="none" stroke="#0A2762" stroke-width="3" marker-end="url(#arr)"/><text x="550" y="831" font-size="26" fill="#536579" font-weight="400" text-anchor="middle"><tspan x="550" dy="0">Được công bố</tspan></text><rect x="35" y="879" width="1330" height="185" rx="12" fill="#FFF4E6" stroke="#FE8700" stroke-width="2"/><text x="700.0" y="922" font-size="32" fill="#0A2762" font-weight="700" text-anchor="middle"><tspan x="700.0" dy="0">Phiên bản thực thi được đăng ký</tspan></text><text x="700.0" y="962" font-size="29" fill="#142538" font-weight="400" text-anchor="middle"><tspan x="700.0" dy="0">Cấu hình có phiên bản và định nghĩa tiến trình</tspan><tspan x="700.0" dy="37">Nguồn kích hoạt cùng chính sách thực thi và hậu xử lý</tspan><tspan x="700.0" dy="37">Sẵn sàng vận hành theo khoảng hiệu lực</tspan></text></g></svg>